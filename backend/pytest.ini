[pytest]
DJANGO_SETTINGS_MODULE = compass.settings.test
python_files = test_*.py tests.py
addopts = --strict-markers -q --disable-warnings
testpaths =
    common
    accounts
    organizations
    knowledge
    prospects
    lakehouse
    tickets
    playbooks
    aiengine
    integrations
    analytics
markers =
    security: tenant isolation and authorization. The highest-severity class of defect.
    retrieval: retrieval relevance and ranking quality.
    acceptance: maps directly to one of the fourteen acceptance criteria.
    slow: takes more than a second.
